name: CPU source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  source-and-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-cpu.txt
      - run: python tools/check_release.py
      - run: python tools/run_cpu_tests.py
